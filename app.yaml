apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: go-api
          image: go-api:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: lab
  labels:
    app: go-api
spec:
  selector:
    app: go-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
